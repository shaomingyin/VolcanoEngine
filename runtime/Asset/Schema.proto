syntax = "proto3";

package Volcano.Asset;

message TextureHeader {
    uint32 width = 1;
    uint32 height = 2;
}

message MeshHeader {
    uint32 vertex_count = 1;
    uint32 index_count = 2;
}

enum AlphaMode {
    ALPHA_MODE_OPAQUE = 0;
    ALPHA_MODE_BLEND = 1;
}

message Vector3 {
    float x = 1;
    float y = 2;
    float z = 3;
}

message Vector4 {
    float x = 1;
    float y = 2;
    float z = 3;
    float w = 4;
}

message Material {
    Vector4 albedo = 1;
    optional float specular = 2;
    optional float metallic = 3;
    optional float roughness = 4;
    Vector3 emissive = 5;
    string albedo_texture = 6;
    string normal_texture = 7;
    string metallic_roughness_texture = 8;
    optional bool lit = 9;
    AlphaMode alpha_mode = 10;
}

message Model {
    message Part {
        string mesh = 1;
        string material = 2;
        repeated float transform = 3;
    }
    repeated Part parts = 1;
}

message Transform {
    Vector3 translation = 1;
    Vector3 scale = 2;
    Vector4 rotation = 3;
}

message MaterialOverride {
    uint32 part = 1;
    string albedo_texture = 2;
}

message ModelRef {
    string source = 1;
    repeated MaterialOverride materials = 2;
}

message PerspectiveCamera {
    optional float fov = 1;
    optional float aspect = 2;
    optional float znear = 3;
    optional float zfar = 4;
    string hud_texture = 5;
}

message OrthographicCamera {
    optional float left = 1;
    optional float right = 2;
    optional float bottom = 3;
    optional float top = 4;
    optional float znear = 5;
    optional float zfar = 6;
    string hud_texture = 7;
}

message DirectionalLight {
    Vector3 direction = 1;
    Vector3 color = 2;
    optional float strength = 3;
}

message PointLight {
    Vector3 color = 1;
    optional float strength = 2;
    optional float range = 3;
}

message SpotLight {
    Vector3 direction = 1;
    Vector3 color = 2;
    optional float strength = 3;
    optional float range = 4;
    optional float inner_angle = 5;
    optional float outer_angle = 6;
}

enum MotionType {
    MOTION_DYNAMIC = 0;
    MOTION_STATIC = 1;
    MOTION_KINEMATIC = 2;
}

message BoxShape {
    Vector3 half_extents = 1;
}

message SphereShape {
    optional float radius = 1;
}

message CapsuleShape {
    optional float half_height = 1;
    optional float radius = 2;
}

message RigidBody {
    oneof shape {
        BoxShape box = 1;
        SphereShape sphere = 2;
        CapsuleShape capsule = 3;
    }
    optional Transform offset = 4;
    optional MotionType motion = 5;
    optional float mass = 6;
    optional float friction = 7;
    optional float restitution = 8;
    optional float linear_damping = 9;
    optional float angular_damping = 10;
    optional float gravity_factor = 11;
}

message Entity {
    string name = 1;
    optional bool enabled = 2;
    optional bool visible = 3;
    optional Transform transform = 4;
    optional ModelRef model = 5;
    optional PerspectiveCamera perspective_camera = 6;
    optional OrthographicCamera orthographic_camera = 7;
    optional DirectionalLight directional_light = 8;
    optional PointLight point_light = 9;
    optional SpotLight spot_light = 10;
    optional RigidBody rigid_body = 11;
}

message Scene {
    string name = 1;
    string description = 2;
    repeated Entity entities = 3;
    optional Vector3 gravity = 4;
}
